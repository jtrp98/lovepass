name: CI

on:
  push:
    branches: [main, 'release/**', 'dev/**', codex/lovepass-online]
  pull_request:

jobs:
  backend:
    name: Backend — build & test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity minimal

      - name: Gmail setup tests
        run: node --test ../scripts/setup-gmail.test.mjs

  frontend:
    name: Frontend — lint & build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint (0 errors เท่านั้น — warning ผ่านได้)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
